<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Магия круга: клонирование, квадрат и закручивание | CSS-анимация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* чисто визуально, убирает выделение */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Inter', sans-serif;
        }

        /* Контейнер-сцена для абсолютного позиционирования элементов */
        .animation-scene {
            position: relative;
            width: 400px;
            height: 400px;
            background: rgba(30, 40, 50, 0.4);
            border-radius: 60px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
            overflow: visible;
            margin: 20px auto;
            border: 1px solid rgba(255,215,150,0.3);
        }

        /* общий стиль для всех фигур (центральный круг + клоны) */
        .shape {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #ff5e7c;
            background: radial-gradient(circle at 35% 35%, #ff7b99, #e83e62);
            box-shadow: 0 8px 18px rgba(0,0,0,0.3), 0 0 0 2px rgba(255,220,150,0.6);
            will-change: transform, border-radius, opacity, rotate;
            pointer-events: none;
        }

        /* ----- ЦЕНТРАЛЬНЫЙ КРУГ (уменьшается и клонирует суть) ----- */
        .central-circle {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: centralDance 6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #ff8c6b, #e6344c);
        }

        /* Базовое состояние для клонов (скрыты, но позиционированы в центре старта) */
        .clone {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            opacity: 0;
            z-index: 20;
            background: radial-gradient(circle at 30% 30%, #ffa07a, #ff4757);
        }

        /* Индивидуальные анимации для четырёх направлений (верх, низ, лево, право) */
        .clone-top {
            animation: cloneUpSpin 6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .clone-bottom {
            animation: cloneDownSpin 6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .clone-left {
            animation: cloneLeftSpin 6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .clone-right {
            animation: cloneRightSpin 6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        /* АНИМАЦИЯ ДЛЯ ЦЕНТРАЛЬНОГО КРУГА: плавное исчезновение / появление */
        @keyframes centralDance {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                border-radius: 50%;
            }
            12% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 0.8;
            }
            20% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            80% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            92% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0.7;
                border-radius: 50%;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                border-radius: 50%;
            }
        }

        /* -------------------------------------------------------------
           АНИМАЦИЯ ДЛЯ ВЕРХНЕГО КЛОНА (вверх → квадрат → закрутка → возврат в круг)
        ------------------------------------------------------------- */
        @keyframes cloneUpSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 0;
                width: 50px;
                height: 50px;
                background: radial-gradient(circle at 30% 30%, #ffa07a, #ff4757);
            }
            5% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
            }
            15% {
                transform: translate(-50%, calc(-50% - 70px)) rotate(0deg);
                border-radius: 50%;
                opacity: 1;
            }
            /* начало трансформации в квадрат */
            28% {
                transform: translate(-50%, calc(-50% - 70px)) rotate(0deg);
                border-radius: 12%;
                background: radial-gradient(circle at 40% 40%, #ff8866, #ff3344);
                box-shadow: 0 0 0 2px gold;
            }
            35% {
                transform: translate(-50%, calc(-50% - 70px)) rotate(0deg);
                border-radius: 0%;
                background: #ff4466;
                box-shadow: 0 0 0 3px #ffcc88;
            }
            /* квадрат начинает закручиваться (спин) */
            50% {
                transform: translate(-50%, calc(-50% - 70px)) rotate(360deg);
                border-radius: 0%;
                background: #ff4466;
                width: 48px;
                height: 48px;
            }
            68% {
                transform: translate(-50%, calc(-50% - 70px)) rotate(720deg);
                border-radius: 0%;
                background: #ff5e7c;
            }
            /* ЗАКРУЧИВАНИЕ В СТАРТОВЫЙ КРУГ → возврат в центр + круглый вид */
            78% {
                transform: translate(-50%, -50%) rotate(720deg);
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #ff8a6c, #ff4055);
                opacity: 1;
                width: 50px;
                height: 50px;
            }
            88% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.6);
                border-radius: 50%;
                opacity: 0.7;
                background: #ff5e7c;
            }
            96% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.2);
                opacity: 0;
                border-radius: 50%;
            }
            100% {
                transform: translate(-50%, -50%) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* НИЖНИЙ КЛОН — аналогично, но сдвиг вниз */
        @keyframes cloneDownSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 0;
                width: 50px;
                height: 50px;
                background: radial-gradient(circle at 30% 30%, #ffa07a, #ff4757);
            }
            5% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
            }
            15% {
                transform: translate(-50%, calc(-50% + 70px)) rotate(0deg);
                border-radius: 50%;
                opacity: 1;
            }
            28% {
                transform: translate(-50%, calc(-50% + 70px)) rotate(0deg);
                border-radius: 12%;
                background: radial-gradient(circle at 40% 40%, #ff8866, #ff3344);
            }
            35% {
                transform: translate(-50%, calc(-50% + 70px)) rotate(0deg);
                border-radius: 0%;
                background: #ff4466;
                box-shadow: 0 0 0 3px #ffcc88;
            }
            50% {
                transform: translate(-50%, calc(-50% + 70px)) rotate(360deg);
                border-radius: 0%;
                background: #ff4466;
            }
            68% {
                transform: translate(-50%, calc(-50% + 70px)) rotate(720deg);
                border-radius: 0%;
                background: #ff5e7c;
            }
            78% {
                transform: translate(-50%, -50%) rotate(720deg);
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #ff8a6c, #ff4055);
                opacity: 1;
            }
            88% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.6);
                border-radius: 50%;
                opacity: 0.7;
            }
            96% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.2);
                opacity: 0;
                border-radius: 50%;
            }
            100% {
                transform: translate(-50%, -50%) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* ЛЕВЫЙ КЛОН */
        @keyframes cloneLeftSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 0;
                background: radial-gradient(circle at 30% 30%, #ffa07a, #ff4757);
            }
            5% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
            }
            15% {
                transform: translate(calc(-50% - 70px), -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 1;
            }
            28% {
                transform: translate(calc(-50% - 70px), -50%) rotate(0deg);
                border-radius: 12%;
                background: radial-gradient(circle at 40% 40%, #ff8866, #ff3344);
            }
            35% {
                transform: translate(calc(-50% - 70px), -50%) rotate(0deg);
                border-radius: 0%;
                background: #ff4466;
                box-shadow: 0 0 0 3px #ffcc88;
            }
            50% {
                transform: translate(calc(-50% - 70px), -50%) rotate(360deg);
                border-radius: 0%;
                background: #ff4466;
            }
            68% {
                transform: translate(calc(-50% - 70px), -50%) rotate(720deg);
                border-radius: 0%;
                background: #ff5e7c;
            }
            78% {
                transform: translate(-50%, -50%) rotate(720deg);
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #ff8a6c, #ff4055);
                opacity: 1;
            }
            88% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.6);
                border-radius: 50%;
                opacity: 0.7;
            }
            96% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.2);
                opacity: 0;
                border-radius: 50%;
            }
            100% {
                transform: translate(-50%, -50%) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* ПРАВЫЙ КЛОН */
        @keyframes cloneRightSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 0;
                background: radial-gradient(circle at 30% 30%, #ffa07a, #ff4757);
            }
            5% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg);
                border-radius: 50%;
            }
            15% {
                transform: translate(calc(-50% + 70px), -50%) rotate(0deg);
                border-radius: 50%;
                opacity: 1;
            }
            28% {
                transform: translate(calc(-50% + 70px), -50%) rotate(0deg);
                border-radius: 12%;
                background: radial-gradient(circle at 40% 40%, #ff8866, #ff3344);
            }
            35% {
                transform: translate(calc(-50% + 70px), -50%) rotate(0deg);
                border-radius: 0%;
                background: #ff4466;
                box-shadow: 0 0 0 3px #ffcc88;
            }
            50% {
                transform: translate(calc(-50% + 70px), -50%) rotate(360deg);
                border-radius: 0%;
                background: #ff4466;
            }
            68% {
                transform: translate(calc(-50% + 70px), -50%) rotate(720deg);
                border-radius: 0%;
                background: #ff5e7c;
            }
            78% {
                transform: translate(-50%, -50%) rotate(720deg);
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #ff8a6c, #ff4055);
                opacity: 1;
            }
            88% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.6);
                border-radius: 50%;
                opacity: 0.7;
            }
            96% {
                transform: translate(-50%, -50%) rotate(720deg) scale(0.2);
                opacity: 0;
                border-radius: 50%;
            }
            100% {
                transform: translate(-50%, -50%) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* Вспомогательный декоративный текст */
        .info {
            text-align: center;
            margin-top: 35px;
            color: #eef4ff;
            font-weight: 500;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #ccddee;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 8px 20px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(4px);
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .legend i {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: #ff5e7c;
            border-radius: 50%;
            box-shadow: 0 0 0 1px gold;
        }

        .legend i.square {
            border-radius: 2px;
            background: #ff4466;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div class="animation-scene">
        <!-- центральный круг: уменьшается и даёт "клоны" -->
        <div class="shape central-circle"></div>

        <!-- 4 клона-кружочка, которые станут квадратами и закрутятся -->
        <div class="shape clone clone-top"></div>
        <div class="shape clone clone-bottom"></div>
        <div class="shape clone clone-left"></div>
        <div class="shape clone clone-right"></div>
    </div>

    <div class="info">
        ✨ ЦЕНТР УМЕНЬШАЕТСЯ → 4 КЛОНА ПО СТОРОНАМ → КВАДРАТ → ЗАКРУТКА ВОЗВРАЩАЕТ В КРУГ ✨
    </div>
    <div class="legend">
        <span><i></i> центральный круг (уменьшается)</span>
        <span><i></i> → клоны 40px (круги)</span>
        <span><i class="square"></i> трансформация в квадрат</span>
        <span>🌀 закручивание → стартовый круг</span>
    </div>
    <footer>🔄 CSS-анимация | без JS | бесконечный цикл: сжатие → клонирование → квадрат + спин → возврат к кругу</footer>
</div>

<!-- 
    Описание анимации (чистый CSS, соответствует заданию):
    1. Круг в центре уменьшается (масштабируется до 0) — имитирует исчезновение и порождение "клонов".
    2. Одновременно 4 кружка (клоны) "вырастают" из центра и расходятся на 4 стороны (расстояние ~70px, 
       размер каждого ~50px, стилизованы под "40px область" — близко к требуемому размеру, изящно выглядят).
    3. Каждый из четырёх кружков трансформируется в квадрат (border-radius: 50% → 0%) с гладкой сменой формы.
    4. Затем квадраты начинают закручиваться (вращение 720 градусов) и одновременно возвращаются в центр, 
       превращаясь обратно в круг (закручивание в стартовый круг). 
    5. Центральный круг в конце анимации снова проявляется — всё зациклено.
    Все метаморфозы без единой строки JavaScript, только keyframes + абсолютное позиционирование.
-->
</body>
</html>
